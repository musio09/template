<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var repo = location.hostname.match(/\.github\.io$/i)
          ? location.pathname.split("/").filter(Boolean)[0]
          : "";
        var base = repo ? "/" + repo + "/" : "/";
        location.replace(base + "index.html");
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=index.html" />
  </head>
  <body>
    <p><a href="index.html">Open the menu</a></p>
  </body>
</html>
