<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        if (!/\.github\.io$/i.test(location.hostname)) return;
        var repo = location.pathname.split("/").filter(Boolean)[0];
        if (!repo) return;
        document.write('<base href="/' + repo + '/">');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4EFE6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Musio Café &amp; Kitchen — the menu." />
    <title>Musio Café &amp; Kitchen · Menu</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/favicon.svg" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="modulepreload" href="js/app.js" />
    <link rel="modulepreload" href="js/config.js" />
    <!-- Fonts load in the background: the menu paints first, never a blank "loading" screen. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      html { background: #f4efe6; }
      body {
        margin: 0;
        background: #f4efe6;
        color: #1c1612;
        font-family: "Outfit", "Noto Sans Ethiopic", "Ebrima", "Segoe UI", sans-serif;
      }
      .splash { padding: 74px 16px 16px; }
      .splash h1 { font-size: 1.3rem; margin: 0; letter-spacing: -0.01em; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#menu">Skip to menu</a>

    <div id="app">
      <div class="splash">
        <h1>Musio Café &amp; Kitchen</h1>
      </div>
    </div>
    <noscript><p style="padding: 16px">This menu needs JavaScript. Call us to order: <a href="tel:+2510000000">+251 000 0000</a>.</p></noscript>

    <dialog class="sheet" id="item-sheet" aria-labelledby="item-sheet-title"></dialog>
    <dialog class="sheet sheet--cart" id="cart-sheet" aria-labelledby="cart-sheet-title"></dialog>
    <dialog class="sheet sheet--search" id="search-sheet" aria-labelledby="search-sheet-title"></dialog>
    <dialog class="sheet sheet--hours" id="hours-sheet" aria-labelledby="hours-sheet-title"></dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
