<html lang="am">

        if (!/\.github\.io$/i.test(location.hostname)) return;
        var repo = location.pathname.split("/").filter(Boolean)[0];
        if (!repo) return;
        document.write('<base href="/' + repo + '/">');
      })();
    </script>

    <style>
/* ── Reset ─────────────────────────────────────────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100dvh;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

img {
  max-width: 100%;
  display: block;
}

button,
input,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: none;
  touch-action: manipulation;
}

a {
  color: inherit;
}

ul {
  list-style: none;
}

:root {
  --bg: #f4efe6;
  --surface: #fffcf7;
  --elevated: #ede6d9;
  --text: #1c1612;
  --text-muted: #6b6158;
  --primary: #c45c26;
  --primary-contrast: #fff8f1;
  --accent: #2f4a3c;
  --accent-contrast: #f4efe6;
  --border: rgba(28, 22, 18, 0.1);
  --overlay: rgba(20, 14, 10, 0.45);
  --radius: 18px;
  --font-display: "Noto Sans Ethiopic", "Kefa", "Ebrima", "Segoe UI", system-ui, sans-serif;
  --font-body: "Noto Sans Ethiopic", "Kefa", "Ebrima", "Segoe UI", system-ui, sans-serif;
  --header-h: 64px;
  --shadow: 0 10px 40px rgba(28, 22, 18, 0.1);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

body[data-theme="dark"] {
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
}

.skip-link {
  position: absolute;
  left: 12px;
  top: -40px;
  background: var(--accent);
  color: var(--accent-contrast);
  padding: 8px 12px;
  border-radius: 8px;
  z-index: 100;
}

.skip-link:focus {
  top: 12px;
}

/* ── Header ────────────────────────────────────────────── */
.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: var(--header-h);
  padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  text-decoration: none;
}

.brand img,
.brand svg {
  width: 32px;
  height: 32px;
  color: var(--accent);
  flex-shrink: 0;
}

.brand__name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.2rem;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.table-badge {
  font-family: var(--font-body);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--elevated);
  color: var(--accent);
  flex-shrink: 0;
}

.header-actions {
  display: flex;
  gap: 6px;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--text);
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  border: 1px solid var(--border);
  transition: transform 0.2s var(--ease), background 0.2s;
}

.icon-btn:hover,
.icon-btn:focus-visible {
  background: var(--elevated);
  outline: none;
}

.icon-btn:active {
  transform: scale(0.94);
}

.icon-btn svg {
  width: 20px;
  height: 20px;
}

.icon-btn--cart {
  position: relative;
}

.cart-count {
  position: absolute;
  top: -2px;
  right: -2px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 99px;
  background: var(--primary);
  color: var(--primary-contrast);
  font-size: 0.68rem;
  font-weight: 700;
  display: grid;
  place-items: center;
}

.cart-count[hidden] {
  display: none;
}

/* ── Pills & buttons ───────────────────────────────────── */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  background: color-mix(in srgb, #fff 16%, transparent);
  border: 1px solid color-mix(in srgb, #fff 24%, transparent);
  font-size: 0.8rem;
  font-family: inherit;
  color: inherit;
  backdrop-filter: blur(8px);
}

.pill--live::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #8fde71;
  box-shadow: 0 0 0 4px rgba(143, 222, 113, 0.25);
}

.pill--closed::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #e8b4a2;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 65%, transparent);
  font-size: 0.78rem;
  font-weight: 600;
  white-space: nowrap;
}

.status-pill.pill--live {
  color: var(--accent);
}

.status-pill.pill--closed {
  color: var(--text-muted);
}

.price {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--accent);
}

.add-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-contrast);
  display: grid;
  place-items: center;
  transition: transform 0.2s var(--ease);
}

.add-btn:hover {
  transform: scale(1.06);
}

.add-btn svg {
  width: 18px;
  height: 18px;
}

/* ── Category nav ──────────────────────────────────────── */
.cat-nav-wrap {
  position: sticky;
  top: var(--header-h);
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}

.cat-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 16px 12px;
  -webkit-overflow-scrolling: touch;
}

.cat-nav::-webkit-scrollbar {
  display: none;
}

.chip {
  flex: 0 0 auto;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 0.86rem;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  transition: 0.2s var(--ease);
}

.chip.is-active {
  background: var(--accent);
  color: var(--accent-contrast);
  border-color: transparent;
}

/* ── Menu ─────────────────────────────────────────────── */
.menu {
  padding: 8px 16px 120px;
}

.menu-section {
  padding-top: 22px;
  scroll-margin-top: calc(var(--header-h) + 58px);
}

.menu-section h3 {
  font-family: var(--font-display);
  font-size: 1.45rem;
  margin-bottom: 12px;
  letter-spacing: -0.02em;
}

.dish-list {
  display: grid;
  gap: 10px;
}

.dish {
  display: grid;
  grid-template-columns: 92px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: left;
  width: 100%;
  transition: transform 0.2s var(--ease), box-shadow 0.2s;
}

.dish:hover {
  box-shadow: var(--shadow);
}

.dish.is-sold {
  opacity: 0.55;
}

.dish__photo {
  width: 92px;
  height: 92px;
  border-radius: 14px;
  object-fit: cover;
  background: var(--elevated);
  cursor: pointer;
}

.dish.no-photo {
  grid-template-columns: 1fr auto;
}

.dish__body {
  min-width: 0;
  width: 100%;
  text-align: left;
}

.dish__name {
  font-weight: 600;
  font-size: 0.98rem;
  letter-spacing: -0.01em;
}

.dish__desc {
  color: var(--text-muted);
  font-size: 0.8rem;
  margin-top: 3px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 7px;
}

.tag {
  font-size: 0.65rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--elevated);
  color: var(--text-muted);
}

.tag--popular {
  background: color-mix(in srgb, var(--primary) 16%, var(--surface));
  color: var(--primary);
}

.tag--spicy {
  background: #fde8e4;
  color: #b42318;
}

.tag--veg,
.tag--vegan {
  background: color-mix(in srgb, var(--accent) 12%, var(--surface));
  color: var(--accent);
}

.tag--gf {
  background: #eee8dc;
  color: #6b6158;
}

.dish__side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  padding-right: 4px;
}

.sold-badge {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--text-muted);
}

/* ── Footer / contact ──────────────────────────────────── */
.contact {
  margin: 12px 16px 24px;
  padding: 24px 20px 20px;
  background: var(--accent);
  color: var(--accent-contrast);
  border-radius: calc(var(--radius) + 6px);
}

.contact h2 {
  font-family: var(--font-display);
  font-size: 1.8rem;
  font-style: italic;
  margin-bottom: 8px;
}

.contact p {
  opacity: 0.86;
  font-weight: 300;
  max-width: 36ch;
}

.contact-list {
  margin-top: 20px;
  display: grid;
  gap: 10px;
}

.contact-list a,
.contact-list span {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  font-size: 0.95rem;
}

.contact-list svg {
  width: 18px;
  height: 18px;
  opacity: 0.85;
  flex-shrink: 0;
}

.hours-list {
  margin-top: 18px;
  display: grid;
  gap: 6px;
  font-size: 0.9rem;
}

.hours-list div {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  opacity: 0.9;
  border-top: 1px solid color-mix(in srgb, var(--accent-contrast) 16%, transparent);
  padding-top: 8px;
}

.site-footer {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.78rem;
  padding: 8px 20px 32px;
}

.site-footer a {
  color: var(--accent);
}

/* ── Cart bar ──────────────────────────────────────────── */
.cart-bar {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 45;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 10px 10px 18px;
  background: var(--accent);
  color: var(--accent-contrast);
  border-radius: 18px;
  box-shadow: 0 16px 40px rgba(28, 22, 18, 0.28);
  transform: translateY(120%);
  transition: transform 0.35s var(--ease);
}

.cart-bar.is-visible {
  transform: translateY(0);
}

.cart-bar__meta {
  display: grid;
  min-width: 0;
}

.cart-bar__meta small {
  opacity: 0.75;
  font-size: 0.75rem;
}

.cart-bar__cta {
  background: var(--primary);
  color: var(--primary-contrast);
  border-radius: 14px;
  padding: 12px 16px;
  font-weight: 600;
  white-space: nowrap;
}

/* ── FABs ──────────────────────────────────────────────── */
.fabs {
  position: fixed;
  right: 14px;
  bottom: calc(18px + env(safe-area-inset-bottom));
  z-index: 35;
  display: grid;
  gap: 10px;
  transition: transform 0.35s var(--ease);
}

.fabs.is-raised {
  transform: translateY(-72px);
}

.fab {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  box-shadow: var(--shadow);
  text-decoration: none;
}

.fab svg {
  width: 24px;
  height: 24px;
}

.fab--wa {
  background: #25d366;
  color: #fff;
}

.fab--call {
  background: var(--surface);
  color: var(--accent);
  border: 1px solid var(--border);
}

/* ── Sheets / dialogs ──────────────────────────────────── */
.sheet {
  width: min(100%, 560px);
  max-height: min(92dvh, 860px);
  margin: auto 0 0 auto;
  border: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  border-radius: 24px 24px 0 0;
  box-shadow: var(--shadow);
}

.sheet::backdrop {
  background: var(--overlay);
  backdrop-filter: blur(4px);
}

.sheet[open] {
  animation: rise 0.38s var(--ease);
}

@keyframes rise {
  from {
    transform: translateY(24px);
    opacity: 0.4;
  }
}

.sheet__grab {
  width: 40px;
  height: 4px;
  border-radius: 99px;
  background: var(--border);
  margin: 10px auto 0;
}

.sheet__hero {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.sheet__body {
  padding: 8px 20px 28px;
}

.sheet__top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
}

.sheet__top h2 {
  font-family: var(--font-display);
  font-size: 1.7rem;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.sheet__close {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--elevated);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.sheet__desc {
  color: var(--text-muted);
  margin: 10px 0 16px;
}

.qty-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 12px 0 16px;
}

.stepper {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px;
}

.stepper button {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--elevated);
  font-size: 1.2rem;
  line-height: 1;
}

.stepper span {
  min-width: 28px;
  text-align: center;
  font-weight: 600;
}

.field {
  display: grid;
  gap: 6px;
  margin-bottom: 12px;
}

.field label {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.field input,
.field textarea {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 12px;
  padding: 12px 14px;
  outline: none;
}

.field input:focus,
.field textarea:focus {
  border-color: var(--accent);
}

.primary-btn {
  width: 100%;
  border-radius: 14px;
  padding: 14px 16px;
  background: var(--primary);
  color: var(--primary-contrast);
  font-weight: 600;
  margin-top: 8px;
}

.primary-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* Cart sheet */
.cart-items {
  display: grid;
  gap: 10px;
  margin: 12px 0 16px;
}

.cart-line {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
}

.cart-line img {
  width: 64px;
  height: 64px;
  border-radius: 10px;
  object-fit: cover;
}

.cart-line h3 {
  font-size: 0.95rem;
}

.cart-line p {
  color: var(--text-muted);
  font-size: 0.8rem;
}

.cart-total {
  display: flex;
  justify-content: space-between;
  font-size: 1.05rem;
  font-weight: 600;
  padding: 8px 0 4px;
}

.cart-empty {
  text-align: center;
  padding: 28px 12px;
  color: var(--text-muted);
}

.search-list {
  display: grid;
  gap: 8px;
  margin-top: 12px;
  max-height: 55dvh;
  overflow: auto;
}

/* ── Desktop ──────────────────────────────────────────── */
@media (min-width: 840px) {
  body {
    background:
      radial-gradient(1200px 500px at 10% -10%, color-mix(in srgb, var(--primary) 18%, transparent), transparent 50%),
      var(--bg);
  }

  #app {
    max-width: 1120px;
    margin: 0 auto;
  }

  .dish-list {
    grid-template-columns: 1fr 1fr;
  }

  .contact {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 24px;
    align-items: start;
  }

  .sheet {
    margin: auto;
    border-radius: 24px;
    width: min(520px, calc(100% - 32px));
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

function assetUrl(path) {
  if (!path) return "";
  if (/^(https?:)?\/\//i.test(path) || path.startsWith("data:") || path.startsWith("blob:") || path.startsWith("#")) {
    return path;
  }
  return String(path).replace(/^\.\//, "");
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function formatPrice(amount) {
  return new Intl.NumberFormat(C.locale, {
    style: "currency",
    currency: C.currency,
    currencyDisplay: "code",
    maximumFractionDigits: 0,
  }).format(amount);
}

function applyTheme() {
  const t = C.theme;
  const root = document.documentElement;
  const map = {
    "--bg": t.background,
    "--surface": t.surface,
    "--elevated": t.elevated,
    "--text": t.text,
    "--text-muted": t.textMuted,
    "--primary": t.primary,
    "--primary-contrast": t.primaryContrast,
    "--accent": t.accent,
    "--accent-contrast": t.accentContrast,
    "--border": t.border,
    "--overlay": t.overlay,
    "--radius": t.radius,
    "--font-display": t.fontDisplay,
    "--font-body": t.fontBody,
  };
  Object.entries(map).forEach(([k, v]) => v && root.style.setProperty(k, v));
  document.body.dataset.theme = t.mode || "light";
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", t.background);
  document.title = `${C.restaurant.name} · \u121D\u1213\u1299`;
  const desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute("content", `${C.restaurant.name} — ${T.meta_desc}`);

  const fav = assetUrl(C.restaurant.favicon || C.restaurant.logo);
  document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach((el) => {
    el.setAttribute("href", fav);
  });

  const manifest = {
    name: `${C.restaurant.name} Menu`,
    short_name: C.restaurant.shortName || C.restaurant.name,
    start_url: new URL("index.html", location.href).href,
    display: "standalone",
    background_color: t.background,
    theme_color: t.accent,
    icons: [{ src: fav, sizes: "any", type: fav.includes(".svg") ? "image/svg+xml" : "image/png" }],
  };
  const manifestLink = document.querySelector('link[rel="manifest"]');
  if (manifestLink) {
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    manifestLink.href = URL.createObjectURL(blob);
  }
}

function getLocalParts() {
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: C.timezone,
    weekday: "short",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23",
  });
  const parts = Object.fromEntries(fmt.formatToParts(new Date()).map((p) => [p.type, p.value]));
  const dayMap = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  return {
    day: dayMap[parts.weekday] ?? new Date().getDay(),
    minutes: Number(parts.hour) * 60 + Number(parts.minute),
  };
}

function openingStatus() {
  const { day, minutes } = getLocalParts();
  const slot = C.hours.find((h) => h.days.includes(day));
  if (!slot) return { open: false, label: T.closed, slot: null };
  const [oh, om] = slot.open.split(":").map(Number);
  const [ch, cm] = slot.close.split(":").map(Number);
  const openMins = oh * 60 + om;
  const closeMins = ch * 60 + cm;
  const open = minutes >= openMins && minutes < closeMins;
  return {
    open,
    label: open ? T.open : T.closed,
    display: slot.display,
    slot,
  };
}

  const tableLine = state.table ? `${T.table} ${state.table}\n` : "";
  const msg = `${C.order.whatsappIntro}\n${tableLine}${lines.join("\n")}\n${T.totalWord}: ${formatPrice(cartTotal())}`;
  return `https://wa.me/${C.contact.whatsapp}?text=${encodeURIComponent(msg)}`;
}

function render() {
  const open = openingStatus();
  const showPhotos = C.features.showPhotos !== false;
  const brand = C.restaurant.shortName || C.restaurant.name;

  els.app.innerHTML = `
    <header class="site-header" id="top">
      <a class="brand" href="#top">
        <img src="${escapeHtml(assetUrl(C.restaurant.logo))}" alt="" />
        <span class="brand__name">${escapeHtml(brand)}</span>
        ${state.table ? `<span class="table-badge">${T.table} ${escapeHtml(state.table)}</span>` : ""}
      </a>
      <div class="header-actions">
        <button class="status-pill ${open.open ? "pill--live" : "pill--closed"}" data-open-hours type="button" aria-label="${T.hours}">
          ${escapeHtml(open.label)}
        </button>
        ${
          C.features.showSearch
            ? `<button class="icon-btn" data-open-search aria-label="${T.search}">${ICONS.search}</button>`
            : ""
        }
        <button class="icon-btn icon-btn--cart" data-open-cart aria-label="${T.cart}">
          ${ICONS.cart}
          <span class="cart-count" ${cartCount() ? "" : "hidden"}>${cartCount()}</span>
        </button>
      </div>
    </header>

    <div class="cat-nav-wrap">
      <nav class="cat-nav" aria-label="${C.restaurant.name}">
        ${C.categories
          .map(
            (cat) => `
          <button class="chip ${cat.id === state.activeCategory ? "is-active" : ""}" data-cat="${escapeHtml(cat.id)}">
            ${escapeHtml(cat.name)}
          </button>`
          )
          .join("")}
      </nav>
    </div>

    <main class="menu" id="menu">
      ${C.categories
        .map((cat) => {
          const items = C.items.filter((i) => i.category === cat.id);
          if (!items.length) return "";
          return `
            <section class="menu-section" id="cat-${escapeHtml(cat.id)}">
              <h3>${escapeHtml(cat.name)}</h3>
              <div class="dish-list">
                ${items.map((item) => dishCard(item, showPhotos)).join("")}
              </div>
            </section>`;
        })
        .join("")}
    </main>

    <section class="contact" id="contact">
      <div>
        <h2>${T.place}</h2>
        <div class="contact-list">
          <a href="${escapeHtml(C.contact.mapsUrl)}" target="_blank" rel="noopener">${ICONS.pin} ${escapeHtml(C.contact.address)}</a>
          <a href="${telLink()}">${ICONS.phone} ${escapeHtml(C.contact.phone)}</a>
          <a href="${waLink()}" target="_blank" rel="noopener">${ICONS.wa} ${T.whatsapp}</a>
          ${
            C.contact.instagram
              ? `<a href="${escapeHtml(C.contact.instagramUrl)}" target="_blank" rel="noopener">${ICONS.ig} @${escapeHtml(C.contact.instagram)}</a>`
              : ""
          }
        </div>
      </div>
      <div>
        <div class="hours-list">
          ${C.hours
            .map(
              (h) => `<div><span>${escapeHtml(h.label)}</span><span>${escapeHtml(h.display)}</span></div>`
            )
            .join("")}
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <p>${escapeHtml(C.priceNote)}</p>
      <p style="margin-top:8px"><a href="${escapeHtml(assetUrl("qr.html"))}">${T.printQR}</a></p>
    </footer>

    <div class="fabs ${cartCount() ? "is-raised" : ""}">
      <a class="fab fab--wa" href="${waLink()}" target="_blank" rel="noopener" aria-label="${T.whatsapp}">${ICONS.wa}</a>
      <a class="fab fab--call" href="${telLink()}" aria-label="${T.call}">${ICONS.phone}</a>
    </div>

    <div class="cart-bar ${cartCount() ? "is-visible" : ""}" data-open-cart>
      <div class="cart-bar__meta">
        <strong>${cartCount()} ${T.items} · ${formatPrice(cartTotal())}</strong>
        <small>${T.bill}</small>
      </div>
      <button class="cart-bar__cta" type="button">${T.bill}</button>
    </div>
  `;

  bindAppEvents();
  observeCategories();
}

function dishCard(item, showPhotos) {
  const sold = item.soldOut;
  return `
    <article class="dish ${showPhotos ? "" : "no-photo"} ${sold ? "is-sold" : ""}">
      ${showPhotos ? `<img class="dish__photo" src="${escapeHtml(assetUrl(item.image))}" alt="${escapeHtml(item.name)}" loading="lazy" data-open-item="${escapeHtml(item.id)}" />` : ""}
      <button class="dish__body" data-open-item="${escapeHtml(item.id)}">
        <div class="dish__name">${escapeHtml(item.name)}</div>
        ${item.description ? `<p class="dish__desc">${escapeHtml(item.description)}</p>` : ""}
        ${item.tags?.length ? `<div class="tags">${tagsHtml(item.tags)}</div>` : ""}
      </button>
      <div class="dish__side">
        <span class="price">${formatPrice(item.price)}</span>
        ${
          sold
            ? `<span class="sold-badge">${T.soldOut}</span>`
            : `<button class="add-btn" data-add="${escapeHtml(item.id)}" aria-label="${T.addToCart}">${ICONS.plus}</button>`
        }
      </div>
    </article>`;
}

function bindAppEvents() {
  els.app.querySelectorAll("[data-add]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      addToCart(btn.dataset.add, 1);
    });
  });

  els.app.querySelectorAll("[data-open-item]").forEach((el) => {
    el.addEventListener("click", () => openItem(el.dataset.openItem));
  });

  els.app.querySelectorAll("[data-open-cart]").forEach((el) => {
    el.addEventListener("click", openCart);
  });

  els.app.querySelector("[data-open-search]")?.addEventListener("click", openSearch);
  els.app.querySelector("[data-open-hours]")?.addEventListener("click", openHours);

  els.app.querySelectorAll("[data-cat]").forEach((chip) => {
    chip.addEventListener("click", () => {
      state.activeCategory = chip.dataset.cat;
      document.querySelector(`#cat-${chip.dataset.cat}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
      els.app.querySelectorAll("[data-cat]").forEach((c) => c.classList.toggle("is-active", c === chip));
    });
  });
}

function observeCategories() {
  const sections = [...document.querySelectorAll(".menu-section")];
  if (!sections.length) return;
  const chips = [...document.querySelectorAll("[data-cat]")];
  const io = new IntersectionObserver(
    (entries) => {
      const visible = entries
        .filter((e) => e.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (!visible) return;
      const id = visible.target.id.replace("cat-", "");
      state.activeCategory = id;
      chips.forEach((c) => c.classList.toggle("is-active", c.dataset.cat === id));
    },
    { rootMargin: "-40% 0px -50% 0px", threshold: [0.1, 0.4] }
  );
  sections.forEach((s) => io.observe(s));
}

function addToCart(id, qty = 1, note = "") {
  const item = itemById(id);
  if (!item || item.soldOut) return;
  const existing = state.cart[id];
  state.cart[id] = {
    id: item.id,
    name: item.name,
    price: item.price,
    image: item.image,
    qty: (existing?.qty || 0) + qty,
    note: note || existing?.note || "",
  };
  saveCart();
  pulseCart();
}

function setQty(id, qty) {
  if (qty <= 0) delete state.cart[id];
  else if (state.cart[id]) state.cart[id].qty = qty;
  saveCart();
}

function pulseCart() {
  const bar = document.querySelector(".cart-bar");
  const fabs = document.querySelector(".fabs");
  const count = document.querySelector(".cart-count");
  const n = cartCount();
  if (count) {
    count.hidden = !n;
    count.textContent = n;
  }
  bar?.classList.toggle("is-visible", n > 0);
  fabs?.classList.toggle("is-raised", n > 0);
  const meta = document.querySelector(".cart-bar__meta strong");
  if (meta) meta.textContent = `${n} ${T.items} · ${formatPrice(cartTotal())}`;
}

function openItem(id) {
  const item = itemById(id);
  if (!item) return;
  state.itemQty = 1;
  state.itemNote = "";
  els.itemSheet.innerHTML = `
    <div class="sheet__grab"></div>
    ${C.features.showPhotos ? `<img class="sheet__hero" src="${escapeHtml(assetUrl(item.image))}" alt="${escapeHtml(item.name)}" />` : ""}
    <div class="sheet__body">
      <div class="sheet__top">
        <h2 id="item-sheet-title">${escapeHtml(item.name)}</h2>
        <button class="sheet__close" data-close aria-label="close">${ICONS.close}</button>
      </div>
      ${item.tags?.length ? `<div class="tags">${tagsHtml(item.tags)}</div>` : ""}
      ${item.description ? `<p class="sheet__desc">${escapeHtml(item.description)}</p>` : ""}
      <div class="qty-row">
        <strong class="price">${formatPrice(item.price)}</strong>
        <div class="stepper">
          <button type="button" data-step="-1" aria-label="-">−</button>
          <span data-qty>1</span>
          <button type="button" data-step="1" aria-label="+">+</button>
        </div>
      </div>
      <button class="primary-btn" data-add-detail ${item.soldOut ? "disabled" : ""}>
        ${item.soldOut ? T.soldOut : `${T.addToCart} · ${formatPrice(item.price)}`}
      </button>
    </div>
  `;
  els.itemSheet.showModal();
  els.itemSheet.querySelector("[data-close]").addEventListener("click", () => els.itemSheet.close());
  els.itemSheet.querySelectorAll("[data-step]").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.itemQty = Math.max(1, state.itemQty + Number(btn.dataset.step));
      els.itemSheet.querySelector("[data-qty]").textContent = state.itemQty;
      const cta = els.itemSheet.querySelector("[data-add-detail]");
      if (!item.soldOut) cta.textContent = `${T.addToCart} · ${formatPrice(item.price * state.itemQty)}`;
    });
  });
  els.itemSheet.querySelector("[data-add-detail]")?.addEventListener("click", () => {
    addToCart(item.id, state.itemQty);
    els.itemSheet.close();
  });
}

function openCart() {
  renderCart();
  els.cartSheet.showModal();
}

function renderCart() {
  const lines = Object.values(state.cart);
  const total = cartTotal();
  els.cartSheet.innerHTML = `
    <div class="sheet__grab"></div>
    <div class="sheet__body">
      <div class="sheet__top">
        <h2 id="cart-sheet-title">${T.yourCart}</h2>
        <button class="sheet__close" data-close aria-label="close">${ICONS.close}</button>
      </div>
      ${
        lines.length
          ? `<div class="cart-items">
              ${lines
                .map(
                  (line) => `
                <div class="cart-line">
                  <img src="${escapeHtml(assetUrl(line.image))}" alt="" />
                  <div>
                    <h3>${escapeHtml(line.name)}</h3>
                    <p>${formatPrice(line.price)} ${T.each}</p>
                    <div class="stepper" style="margin-top:8px">
                      <button type="button" data-line-step="${escapeHtml(line.id)}" data-delta="-1" aria-label="-">−</button>
                      <span>${line.qty}</span>
                      <button type="button" data-line-step="${escapeHtml(line.id)}" data-delta="1" aria-label="+">+</button>
                    </div>
                    <button type="button" data-remove="${escapeHtml(line.id)}" style="margin-top:6px;font-size:0.75rem;font-weight:600;color:var(--text-muted);min-height:32px">${T.remove}</button>
                  </div>
                  <strong class="price">${formatPrice(line.price * line.qty)}</strong>
                </div>`
                )
                .join("")}
            </div>
            <div class="cart-total"><span>${T.total}</span><span>${formatPrice(total)}</span></div>
            <a class="primary-btn order-btn" href="${orderLink()}" target="_blank" rel="noopener">${ICONS.wa} ${T.order}</a>
          `
          : `<div class="cart-empty"><p>${escapeHtml(C.order.emptyCartHint)}</p></div>`
      }
    </div>
  `;

  els.cartSheet.querySelector("[data-close]").addEventListener("click", () => els.cartSheet.close());
  els.cartSheet.querySelectorAll("[data-line-step]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.lineStep;
      const next = (state.cart[id]?.qty || 0) + Number(btn.dataset.delta);
      setQty(id, next);
      pulseCart();
      renderCart();
    });
  });
  els.cartSheet.querySelectorAll("[data-remove]").forEach((btn) => {
    btn.addEventListener("click", () => {
      setQty(btn.dataset.remove, 0);
      pulseCart();
      renderCart();
    });
  });
}

function openHours() {
  const status = openingStatus();
  els.hoursSheet.innerHTML = `
    <div class="sheet__grab"></div>
    <div class="sheet__body">
      <div class="sheet__top">
        <h2 id="hours-sheet-title">${T.hours}</h2>
        <button class="sheet__close" data-close aria-label="close">${ICONS.close}</button>
      </div>
      <p class="sheet__desc">${status.open ? T.hoursOpen : T.hoursClosed}</p>
      <div class="hours-list" style="color: inherit;">
        ${C.hours
          .map(
            (h) => `<div><span>${escapeHtml(h.label)}</span><span>${escapeHtml(h.display)}</span></div>`
          )
          .join("")}
      </div>
    </div>
  `;
  els.hoursSheet.showModal();
  els.hoursSheet.querySelector("[data-close]").addEventListener("click", () => els.hoursSheet.close());
}

function openSearch() {
  els.searchSheet.innerHTML = `
    <div class="sheet__grab"></div>
    <div class="sheet__body">
      <div class="sheet__top">
        <h2 id="search-sheet-title">${T.search}</h2>
        <button class="sheet__close" data-close aria-label="close">${ICONS.close}</button>
      </div>
      <label class="field">
        <span>${T.findDish}</span>
        <input type="search" data-q placeholder="${T.searchPh}" autofocus />
      </label>
      <div class="search-list" data-results></div>
    </div>
  `;
  els.searchSheet.showModal();
  const input = els.searchSheet.querySelector("[data-q]");
  const results = els.searchSheet.querySelector("[data-results]");
  const paint = () => {
    const q = input.value.trim().toLowerCase();
    const matches = q
      ? C.items.filter((i) => `${i.name} ${i.description || ""} ${i.tags.join(" ")}`.toLowerCase().includes(q))
      : C.items.slice(0, 8);
    results.innerHTML = matches.length
      ? matches.map((item) => dishCard(item, true)).join("")
      : `<p class="cart-empty">${T.noResults}</p>`;
    results.querySelectorAll("[data-add]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        addToCart(btn.dataset.add, 1);
      });
    });
    results.querySelectorAll("[data-open-item]").forEach((el) => {
      el.addEventListener("click", () => {
        els.searchSheet.close();
        openItem(el.dataset.openItem);
      });
    });
  };
  input.addEventListener("input", paint);
  paint();
  els.searchSheet.querySelector("[data-close]").addEventListener("click", () => els.searchSheet.close());
  setTimeout(() => input.focus(), 50);
}

document.querySelectorAll(".sheet").forEach((dialog) => {
  dialog.addEventListener("click", (e) => {
    if (e.target === dialog) dialog.close();
  });
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    document.querySelectorAll("dialog[open]").forEach((d) => d.close());
  }
});

applyTheme();
render();
    </script>
  </body>
</html>
