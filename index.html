<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4EFE6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Scan, browse, and order — a digital menu for Olivetta." />
    <title>Olivetta · Menu</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/favicon.svg" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#menu">Skip to menu</a>

    <div id="app">
      <div class="boot" aria-live="polite">
        <img src="./assets/logo.svg" alt="" class="boot__logo" />
        <p>Setting the table…</p>
      </div>
    </div>

    <dialog class="sheet" id="item-sheet" aria-labelledby="item-sheet-title"></dialog>
    <dialog class="sheet sheet--cart" id="cart-sheet" aria-labelledby="cart-sheet-title"></dialog>
    <dialog class="sheet sheet--search" id="search-sheet" aria-labelledby="search-sheet-title"></dialog>
    <dialog class="sheet sheet--hours" id="hours-sheet" aria-labelledby="hours-sheet-title"></dialog>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
