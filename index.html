<!DOCTYPE html>
<html lang="am">
  <head>
    <script>
      (function () {
        if (!/\.github\.io$/i.test(location.hostname)) return;
        var repo = location.pathname.split("/").filter(Boolean)[0];
        if (!repo) return;
        document.write('<base href="/' + repo + '/">');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4EFE6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Musio Cafe — መኑን ይመልኩ፣ ምብ ይጨምሩ፣ አዝዝንም በዋትስአፕ ይኩ።" />
    <title>Musio · መኒ</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/favicon.svg" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#menu">Skip to menu</a>

    <div id="app">
      <div class="boot" aria-live="polite">
        <img src="assets/logo.svg" alt="" class="boot__logo" />
        <p>በቅጽበት…</p>
      </div>
    </div>

    <dialog class="sheet" id="item-sheet" aria-labelledby="item-sheet-title"></dialog>
    <dialog class="sheet sheet--cart" id="cart-sheet" aria-labelledby="cart-sheet-title"></dialog>
    <dialog class="sheet sheet--search" id="search-sheet" aria-labelledby="search-sheet-title"></dialog>
    <dialog class="sheet sheet--hours" id="hours-sheet" aria-labelledby="hours-sheet-title"></dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
